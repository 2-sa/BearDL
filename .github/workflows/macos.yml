on:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: '2026.5.0'
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:
name: macOS
permissions:
  id-token: write
  contents: read
env:
  PROJECT_NAME: Nickvision.Parabolic.GNOME
  APP_NAME: BearDL
  RELEASE_VERSION: ${{ inputs.release_version || '2026.5.0' }}
jobs:
  gnome-macos:
    name: "GNOME on macOS"
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: arm64
            runner: macos-15
            runtime: osx-arm64
          - arch: x64
            runner: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Setup Environment"
        run: |
          brew install gtk4 libadwaita blueprint-compiler gettext glib aria2 ffmpeg deno
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp_macos" -o "${{ github.workspace }}/resources/macos/yt-dlp"
          chmod +x "${{ github.workspace }}/resources/macos/yt-dlp"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: "Restore"
        run: dotnet restore ${{ env.PROJECT_NAME }} --runtime ${{ matrix.variant.runtime }} /p:PublishReadyToRun=true
      - name: "Package"
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x resources/macos/publish-and-package.sh
          ./resources/macos/publish-and-package.sh ${{ matrix.variant.runtime }}
      - name: "Archive app bundle"
        run: |
          test -d resources/macos/BearDL.app
          broken_links=$(find resources/macos/BearDL.app -type l ! -exec test -e {} \; -print)
          test -z "$broken_links" || { printf '%s\n' "$broken_links"; exit 1; }
          codesign --force --deep --sign - resources/macos/BearDL.app
          codesign --verify --deep --strict resources/macos/BearDL.app
          ditto -c -k --sequesterRsrc --keepParent resources/macos/BearDL.app BearDL-macOS-${{ matrix.variant.arch }}.zip
      - name: Create and verify DMG
        env:
          PACKAGE_ARCH: ${{ matrix.variant.arch }}
        run: |
          set -euo pipefail
          staging_dir=$(mktemp -d "$RUNNER_TEMP/beardl-dmg.XXXXXX")
          mount_dir=$(mktemp -d "$RUNNER_TEMP/beardl-dmg-mount.XXXXXX")
          dmg_path="$GITHUB_WORKSPACE/BearDL-macOS-$PACKAGE_ARCH.dmg"
          ditto resources/macos/BearDL.app "$staging_dir/BearDL.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create -volname "BearDL $RELEASE_VERSION" -srcfolder "$staging_dir" -format UDZO "$dmg_path"
          hdiutil verify "$dmg_path"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          test -d "$mount_dir/BearDL.app"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          codesign --verify --deep --strict "$mount_dir/BearDL.app"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          path: |
            ${{ github.workspace }}/BearDL-macOS-${{ matrix.variant.arch }}.zip
            ${{ github.workspace }}/BearDL-macOS-${{ matrix.variant.arch }}.dmg
          name: BearDL-macOS-${{ matrix.variant.arch }}
          if-no-files-found: error
