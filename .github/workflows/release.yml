name: Build and release BearDL
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: beardl-release
  cancel-in-progress: false

jobs:
  plugins:
    uses: ./.github/workflows/plugins.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=2026.5.$((100 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  windows:
    needs: [version, plugins]
    uses: ./.github/workflows/windows.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  macos:
    needs: [version, plugins]
    uses: ./.github/workflows/macos.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  linux:
    needs: [version, plugins]
    uses: ./.github/workflows/flatpak.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( -name 'BearDLSetup-*.exe' -o -name 'BearDL-macOS-*.zip' -o -name 'BearDL-linux-*.flatpak' \) -exec cp {} release/ \;
          for arch in x64 arm64; do
            (cd "artifacts/BearDLPortable-$arch" && zip -qr "../../release/BearDLPortable-$arch.zip" .)
          done
          for file in BearDLSetup-x64.exe BearDLSetup-arm64.exe BearDLPortable-x64.zip BearDLPortable-arm64.zip BearDL-macOS-x64.zip BearDL-macOS-arm64.zip BearDL-linux-x86_64.flatpak BearDL-linux-aarch64.flatpak; do
            test -s "release/$file"
          done
          (cd release && sha256sum *.exe *.zip *.flatpak > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          BearDL builds for Windows, macOS, and Linux from the same source commit.

          - Windows: x64/ARM64 installers and portable ZIPs.
          - macOS: Apple Silicon (arm64) and Intel (x64); macOS 15 or later. Extract the ZIP and move BearDL.app to Applications. These bundles use ad-hoc signing and are not Apple-notarized.
          - Linux: x86_64/aarch64 Flatpak bundles.
          - Includes Arabic RTL improvements and optional Fast Download (best quality, MP4 video, full playlists).
          - SHA256SUMS.txt contains checksums for all packages.

          CI build success does not replace visual or download testing on each platform.
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha)
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "$VERSION" release/* --clobber
          else
            gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "BearDL $VERSION" --notes-file notes.md
          fi
