name: Download and subtitle checks
on:
  push:
    branches: [main]
  workflow_call:
  pull_request:
    paths:
      - 'resources/yt-dlp-plugins/**'
      - 'resources/po/**'
      - 'tests/plugins/**'
      - 'tests/duplicates/**'
      - 'tests/windows/Clipboard*'
      - 'Nickvision.Parabolic.WinUI/Helpers/FileClipboard.cs'
      - 'Nickvision.Parabolic.Shared/Models/DuplicateDownload.cs'
      - 'Nickvision.Parabolic.Shared/Services/DownloadService.cs'
      - 'Nickvision.Parabolic.Shared/Controllers/AddDownloadDialogController.cs'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-clipboard:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025-vs2026, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify native file clipboard interoperability
        run: dotnet run --project tests/windows/ClipboardChecks.csproj --configuration Release

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gettext on the runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
      - name: Validate translation catalogs before platform builds
        shell: bash
        run: |
          set -euo pipefail
          for catalog in resources/po/*.po; do
            echo "Checking $catalog"
            # msgmerge also rejects active/obsolete duplicate identities.
            # Write nowhere: validation must not update tracked catalogs.
            msgmerge --quiet "$catalog" resources/po/parabolic.pot --output-file=/dev/null
            msgfmt "$catalog" --output-file=/dev/null
          done

  duplicate-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check duplicate download detection
        run: dotnet run --project tests/duplicates/DuplicateDownloadChecks.csproj --configuration Release

  subtitles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ytdlp: ['2026.3.17', '2026.10.21', 'latest']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install yt-dlp for compatibility checks
        env:
          YTDLP_VERSION: ${{ matrix.ytdlp }}
        run: |
          if [ "$YTDLP_VERSION" = latest ]; then
            python -m pip install --upgrade yt-dlp
          else
            python -m pip install "yt-dlp==$YTDLP_VERSION"
          fi
      - name: Test subtitle extraction without network requests
        run: python -m unittest discover -s tests/plugins -v
