on:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: '2026.5.0'
  pull_request:
    branches: [ "main" ]
    types: [ "review_requested", "ready_for_review" ]
  workflow_dispatch:
name: Flatpak
permissions:
  id-token: write
  contents: read
jobs:
  gnome-flatpak:
    name: "GNOME on Flatpak"
    if: ${{ github.event.pull_request.user.login != 'weblate' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: "Set release version"
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '2026.5.0' }}
        run: |
          python3 - <<'PY'
          import json, os
          path = 'flatpak/org.nickvision.tubeconverter.json'
          with open(path) as file:
              manifest = json.load(file)
          manifest['build-options'].setdefault('env', {})['RELEASE_VERSION'] = os.environ['RELEASE_VERSION']
          with open(path, 'w') as file:
              json.dump(manifest, file, indent=2)
          PY
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: BearDL-linux-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/org.nickvision.tubeconverter.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          restore-cache: true
          verbose: true
