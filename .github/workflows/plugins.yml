name: Download and subtitle checks
on:
  workflow_call:
  pull_request:
    paths:
      - 'resources/yt-dlp-plugins/**'
      - 'tests/plugins/**'
      - 'tests/duplicates/**'
      - 'Nickvision.Parabolic.Shared/Models/DuplicateDownload.cs'
      - 'Nickvision.Parabolic.Shared/Services/DownloadService.cs'
      - 'Nickvision.Parabolic.Shared/Controllers/AddDownloadDialogController.cs'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check duplicate download detection
        run: dotnet run --project tests/duplicates/DuplicateDownloadChecks.csproj --configuration Release

  subtitles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ytdlp: ['2026.3.17', 'latest']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install yt-dlp for compatibility checks
        env:
          YTDLP_VERSION: ${{ matrix.ytdlp }}
        run: |
          if [ "$YTDLP_VERSION" = latest ]; then
            python -m pip install --upgrade yt-dlp
          else
            python -m pip install "yt-dlp==$YTDLP_VERSION"
          fi
      - name: Test subtitle extraction without network requests
        run: python -m unittest discover -s tests/plugins -v
